name: Build custom image

# amd64 build of the fork's image on every push to a custom/* branch.
# Pushes ghcr.io/<owner>/postiz-app:<branch>-<sha7>.
on:
  push:
    branches: ['custom/**']
  workflow_dispatch:

concurrency:
  group: build-custom-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Fork suites: every jest.<feature>.config.cjs at the repo root.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: juls_contract
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated Juls contract database
        run: pnpm run prisma-db-push
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/juls_contract
      - name: Fork test suites
        env:
          JULS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/juls_contract
        run: |
          status=0
          for config in jest.*.config.cjs; do
            echo "::group::$config"
            pnpm exec jest --config "$config" --ci || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Readiness checks
        run: node --test ops/postiz-readiness/*.test.cjs

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${branch}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=${branch}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.custom
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: NEXT_PUBLIC_VERSION=${{ steps.tag.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: echo "Pushed ${{ steps.tag.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
