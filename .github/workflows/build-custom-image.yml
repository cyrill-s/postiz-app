name: Build custom image

# Manual, amd64-only build of the fork's image from the selected branch.
# Pushes ghcr.io/<owner>/postiz-app:<branch>-<sha7>.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Fork suites: every jest.<feature>.config.cjs at the repo root.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fork test suites
        run: |
          status=0
          for config in jest.*.config.cjs; do
            echo "::group::$config"
            pnpm exec jest --config "$config" --ci || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Readiness checks
        run: node --test ops/postiz-readiness/*.test.cjs

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${branch}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=${branch}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.custom
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: NEXT_PUBLIC_VERSION=${{ steps.tag.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: echo "Pushed ${{ steps.tag.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
